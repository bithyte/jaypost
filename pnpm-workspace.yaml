packages:
  - apps/*
  - packages/*

# One version per third-party dep; apps/cli lists them all because the bundle keeps them external
catalog:
  '@clack/prompts': ^1.8.1
  '@discordjs/core': ^2.6.0
  '@discordjs/rest': ^2.6.3
  '@discordjs/ws': ^2.0.4
  '@modelcontextprotocol/sdk': ^1.32.1
  commander: ^15.0.0
  fastify: ^5.12.7
  grammy: ^1.46.0
  yaml: ^2.9.1
  zod: ^4.6.7

# Vite+ manages the Node and pnpm versions; keep pnpm from switching them itself
runtimeOnFail: ignore
pmOnFail: ignore

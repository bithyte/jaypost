openapi: 3.1.0
info:
  title: jaypost
  version: 0.9.0
  description: Local HTTP API that asks you a question in a chat app with buttons and returns your answer.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8787
security:
  - bearerAuth: []
tags:
  - name: admin
    description: Managing bots, pairings and keys. Needs the admin key; an API key gets 401 like a missing one.
paths:
  /request:
    post:
      operationId: request
      summary: Ask a question and wait for the answer
      description: Stays open until the owner answers (tap, or text reply with `allowText`) or the timeout fires. Disconnecting cancels the question.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: The tapped or typed answer, or `timeoutOption` on timeout; with `retry`, also the rounds asked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outcome"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          description: Internal error, or the request was cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotSupported"
        "502":
          $ref: "#/components/responses/SendFailed"
        "503":
          $ref: "#/components/responses/NotPaired"
  /request/async:
    post:
      operationId: requestAsync
      summary: Ask a question with buttons and return at once
      description: Returns once the message is sent. Poll `GET /request/{id}` for the answer. The question outlives the connection and is cancelled only by `DELETE /request/{id}`, the timeout or the owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "202":
          description: Sent and pending.
          headers:
            Location:
              description: Path of the question, `/request/{id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "501":
          $ref: "#/components/responses/NotSupported"
        "502":
          $ref: "#/components/responses/SendFailed"
        "503":
          $ref: "#/components/responses/NotPaired"
  /request/{id}:
    get:
      operationId: getRequest
      summary: State of a background question, optionally waiting for it to settle
      description: Without `wait` answers at once. With `wait`, stays open until the question settles or `wait` seconds pass, then returns the state. Disconnecting does not cancel the question.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: wait
          in: query
          required: false
          description: Seconds to wait for the question to settle. Default 0; values above 120 are clamped.
          schema:
            type: number
            minimum: 0
      responses:
        "200":
          description: The current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestState"
        "400":
          description: "`wait` is not a non-negative number."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownRequest"
        "503":
          $ref: "#/components/responses/BotUnavailable"
    delete:
      operationId: cancelRequest
      summary: Cancel a background question
      description: Cancels a pending question and edits its message to a cancelled line. A settled question keeps its state.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: "The state after the call: `cancelled`, or the earlier `done`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownRequest"
        "503":
          $ref: "#/components/responses/BotUnavailable"
  /vote:
    post:
      operationId: vote
      summary: Ask several people the same yes/no question and wait for the decision
      description: Sends one message per voter and stays open until the vote is decided or its rounds run out. `options` must be `[approve, reject]` and `timeoutOption` the reject answer, without `allowText`. Once decided, every open message is closed with the result. Disconnecting cancels every open message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteRequest"
      responses:
        "200":
          description: The decision and each voter's answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          description: Internal error, or the vote was cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotSupported"
        "502":
          description: A voter's message couldn't be sent; `voter` names them. The messages already sent are cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  voter:
                    type: string
                required:
                  - error
                  - voter
        "503":
          $ref: "#/components/responses/NotPaired"
  /notify:
    post:
      operationId: notify
      summary: Send a message that doesn't need an answer
      description: Returns once the message is sent. The message has a Dismiss button and is deleted automatically later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyRequest"
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                required:
                  - ok
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "501":
          $ref: "#/components/responses/NotSupported"
        "502":
          $ref: "#/components/responses/SendFailed"
        "503":
          $ref: "#/components/responses/NotPaired"
  /status:
    get:
      operationId: status
      summary: Pairing state
      responses:
        "200":
          description: "`code` and `instructions` are present only while unpaired."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /log:
    get:
      operationId: log
      summary: The caller key's questions
      description: Oldest first. Only the questions asked with the caller key.
      parameters:
        - name: since
          in: query
          required: false
          description: "Only questions asked since then: a duration like `30m`, `12h` or `7d`, a date or an ISO date-time."
          schema:
            type: string
        - name: project
          in: query
          required: false
          description: Only questions with this `project`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Only the last this many questions.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The questions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogPage"
        "400":
          description: A query parameter is invalid or given more than once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /openapi.yaml:
    get:
      operationId: openapi
      summary: This document
      security: []
      responses:
        "200":
          description: OpenAPI document for this service.
          content:
            application/yaml:
              schema:
                type: string
  /admin/bots:
    get:
      tags:
        - admin
      security:
        - adminKey: []
      operationId: listBots
      summary: List bots
      responses:
        "200":
          description: Every stored bot, never its settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bots:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminBot"
                required:
                  - bots
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - admin
      security:
        - adminKey: []
      operationId: addBot
      summary: Add a bot and start it
      description: Parses each setting, asks the provider to check the credentials, saves the bot and waits for its first start attempt. No restart needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBotBody"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bot:
                    $ref: "#/components/schemas/AdminBot"
                required:
                  - bot
        "400":
          description: Unknown provider; a missing, invalid or unknown setting; the owner setting; or credentials the provider rejected, with its reason. Never quotes a setting value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another stored bot already uses these credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/SaveFailed"
  /admin/bots/{id}:
    delete:
      tags:
        - admin
      security:
        - adminKey: []
      operationId: removeBot
      summary: Remove a bot with its pairings and keys
      description: Stops the bot. Its open questions are answered with their timeout option. Its log files stay on disk.
      parameters:
        - $ref: "#/components/parameters/BotId"
      responses:
        "200":
          description: Removed; `removedKeys` are the keys that went with it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedKeys"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownId"
        "500":
          $ref: "#/components/responses/SaveFailed"
  /admin/pairings:
    get:
      tags:
        - admin
      security:
        - adminKey: []
      operationId: listPairings
      summary: List pairings
      parameters:
        - name: bot
          in: query
          required: false
          description: Only this bot's pairings.
          schema:
            type: string
      responses:
        "200":
          description: The pairings, with their keys and, while pending, their code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairings:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminPairing"
                required:
                  - pairings
        "400":
          description: A filter was given more than once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownId"
    post:
      tags:
        - admin
      security:
        - adminKey: []
      operationId: createPairing
      summary: Invite an approver
      description: A pairing with no key, waiting for its code. On a bot that doesn't pair, the bot's one pairing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePairingBody"
      responses:
        "201":
          description: The pairing and, while pending, its code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingInvite"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownId"
        "500":
          $ref: "#/components/responses/SaveFailed"
  /admin/pairings/{id}/reset:
    post:
      tags:
        - admin
      security:
        - adminKey: []
      operationId: resetPairing
      summary: Remove a pairing's person and wait for a new one
      description: Its keys stay and wait for the new code. Their open questions are answered with their timeout option.
      parameters:
        - $ref: "#/components/parameters/PairingId"
      responses:
        "200":
          description: The pending pairing and its new code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingInvite"
        "400":
          description: The pairing is on a bot that doesn't pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownId"
        "500":
          $ref: "#/components/responses/SaveFailed"
  /admin/pairings/{id}:
    delete:
      tags:
        - admin
      security:
        - adminKey: []
      operationId: removePairing
      summary: Remove a pairing and revoke its keys
      description: Their open questions are answered with their timeout option.
      parameters:
        - $ref: "#/components/parameters/PairingId"
      responses:
        "200":
          description: Removed; `removedKeys` are the revoked keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedKeys"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownId"
        "500":
          $ref: "#/components/responses/SaveFailed"
  /admin/keys:
    get:
      tags:
        - admin
      security:
        - adminKey: []
      operationId: listKeys
      summary: List API keys
      parameters:
        - name: bot
          in: query
          required: false
          description: Only keys on this bot's pairings.
          schema:
            type: string
        - name: pairing
          in: query
          required: false
          description: Only keys on this pairing.
          schema:
            type: string
      responses:
        "200":
          description: The keys, never their hashes or plaintext.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminKey"
                required:
                  - keys
        "400":
          description: A filter was given more than once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownId"
    post:
      tags:
        - admin
      security:
        - adminKey: []
      operationId: createKey
      summary: Create an API key
      description: On a new pairing (`bot`), the key waits until someone sends the code to the bot. On an existing pairing (`pairing` or `sameAsKey`), it works at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyBody"
      responses:
        "201":
          description: The key. `key` is the plaintext, shown only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedKey"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownId"
        "500":
          $ref: "#/components/responses/SaveFailed"
  /admin/keys/{id}:
    patch:
      tags:
        - admin
      security:
        - adminKey: []
      operationId: updateKey
      summary: Change a key's label or external id
      parameters:
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKeyBody"
      responses:
        "200":
          description: The key as it is now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    $ref: "#/components/schemas/AdminKey"
                required:
                  - key
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownId"
        "500":
          $ref: "#/components/responses/SaveFailed"
    delete:
      tags:
        - admin
      security:
        - adminKey: []
      operationId: revokeKey
      summary: Revoke an API key
      description: Its open questions are answered with their timeout option. Its pairing stays.
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "200":
          description: Revoked; an empty object.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownId"
        "500":
          $ref: "#/components/responses/SaveFailed"
  /admin/log:
    get:
      tags:
        - admin
      security:
        - adminKey: []
      operationId: readAdminLog
      summary: Every bot's questions
      description: Oldest first, each with its bot. `pairing` and `key` may name removed ones, so their history stays readable.
      parameters:
        - name: bot
          in: query
          required: false
          description: Only this bot's questions.
          schema:
            type: string
        - name: pairing
          in: query
          required: false
          description: Only this pairing's questions.
          schema:
            type: string
        - name: key
          in: query
          required: false
          description: Only this key's questions.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: "Only questions asked since then: a duration like `30m`, `12h` or `7d`, a date or an ISO date-time."
          schema:
            type: string
        - name: project
          in: query
          required: false
          description: Only questions with this `project`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Only the last this many questions.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The questions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogPage"
        "400":
          description: A query parameter is invalid or given more than once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownId"
  /admin/admin-key:
    post:
      tags:
        - admin
      security:
        - adminKey: []
      operationId: rotateAdminKey
      summary: Replace the admin key
      description: Writes the new key to the admin key file; the old key stops working at once.
      responses:
        "200":
          description: The new admin key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotatedAdminKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/SaveFailed"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key, such as the one `init` saved to `~/.config/jaypost/token`. A service installed without a token treats a call without the header as its first key.
    adminKey:
      type: http
      scheme: bearer
      description: The admin key, in `~/.config/jaypost/admin-key` on the machine running the service. Only the admin routes take it.
  schemas:
    ApprovalRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          description: "Message shown in the chat. Must not be blank, at most 3900 characters; with `format: markdown` the markup is removed before counting. With `project`, the limit covers the `[project]` line too, so the text gets `project.length + 4` fewer characters."
        project:
          type: string
          minLength: 1
          maxLength: 100
          description: Shown as `[project]` on the first line. Trimmed.
        format:
          type: string
          enum:
            - plain
            - markdown
          description: "`plain` (default) or `markdown`, a small subset: code spans and fenced blocks, bold, italic, strikethrough, headings and quotes. Anything else stays as typed. See docs/formatting.md in the repo."
        allowText:
          type: boolean
          description: Let the owner answer by replying with text. Default false.
        options:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: Button labels, unique. Required and non-empty unless `allowText`; with it, may be omitted or empty for a text-only question.
        timeoutOption:
          type: string
          description: Answer returned on timeout. Without `allowText`, must be one of `options`; with it, any non-empty string of at most 64 characters.
        timeout:
          type: number
          exclusiveMinimum: 0
          description: Seconds to wait. Default 300, max 86400 (24 h); larger values are clamped.
        attachment:
          $ref: "#/components/schemas/Attachment"
        retry:
          type: integer
          minimum: 0
          maximum: 100
          description: Ask again after a timeout up to this many times; the answer then has `rounds`. `/request/async` answers 400 to it.
      required:
        - text
        - timeoutOption
    VoteRequest:
      allOf:
        - $ref: "#/components/schemas/ApprovalRequest"
        - type: object
          properties:
            voters:
              minItems: 1
              maxItems: 25
              type: array
              items:
                type: string
                minLength: 1
              description: User ids to ask, one message each; default the owner. Each must have started a chat with the bot. Duplicates count once.
            require:
              type: string
              enum:
                - all
                - majority
              description: "`all` voters must approve (default), or a `majority` of them."
            retry:
              type: integer
              minimum: 0
              maximum: 100
              description: Rounds after the first; each re-asks only voters who timed out. Default 0. Running out of rounds rejects.
    Attachment:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: File name shown in the chat app. Its extension decides how the app opens it. Not trimmed; no `/`, `\` or control characters, not `.` or `..`.
        text:
          type: string
          description: File contents as UTF-8 text. Exactly one of `text` and `data`.
        data:
          type: string
          description: File contents as base64 (standard alphabet, padding optional, line breaks allowed). Exactly one of `text` and `data`.
      required:
        - name
      description: An optional file sent to the chat as a document with the message. Exactly one of `text` (UTF-8) or `data` (standard base64, line breaks allowed). Decoded size 1 to 10485760 bytes. Send big files as data; heavy JSON escaping in text can push the body over the size limit.
    Outcome:
      type: object
      properties:
        answer:
          type: string
          description: The tapped option, the typed reply, or `timeoutOption`.
        timedOut:
          type: boolean
        rounds:
          type: integer
          minimum: 1
          description: Rounds asked; present only when the body had `retry`.
      required:
        - answer
        - timedOut
    VoteReport:
      type: object
      properties:
        answer:
          type: string
          description: The first option when approved, else the second.
        timedOut:
          type: boolean
          description: The rounds ran out undecided, which rejects.
        approved:
          type: boolean
        require:
          type: string
          enum:
            - all
            - majority
        votes:
          type: object
          description: Each voter's answer, `null` when they never voted.
          additionalProperties:
            type:
              - string
              - "null"
        rounds:
          type: integer
          minimum: 1
      required:
        - answer
        - timedOut
        - approved
        - require
        - votes
        - rounds
    PendingRequest:
      type: object
      properties:
        id:
          type: string
        state:
          const: pending
        expiresAt:
          type: string
          format: date-time
          description: When the timeout fires.
      required:
        - id
        - state
        - expiresAt
    RequestState:
      oneOf:
        - $ref: "#/components/schemas/PendingRequest"
        - type: object
          properties:
            id:
              type: string
            state:
              const: done
            answer:
              type: string
              description: The tapped option, or `timeoutOption`.
            timedOut:
              type: boolean
          required:
            - id
            - state
            - answer
            - timedOut
        - type: object
          properties:
            id:
              type: string
            state:
              const: cancelled
          required:
            - id
            - state
    NotifyRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          description: "Message shown in the chat. Must not be blank, at most 3900 characters; with `format: markdown` the markup is removed before counting. With `project`, the limit covers the `[project]` line too, so the text gets `project.length + 4` fewer characters."
        project:
          type: string
          minLength: 1
          maxLength: 100
          description: Shown as `[project]` on the first line. Trimmed.
        format:
          type: string
          enum:
            - plain
            - markdown
          description: "`plain` (default) or `markdown`, a small subset: code spans and fenced blocks, bold, italic, strikethrough, headings and quotes. Anything else stays as typed. See docs/formatting.md in the repo."
        attachment:
          $ref: "#/components/schemas/Attachment"
      required:
        - text
    Status:
      oneOf:
        - type: object
          properties:
            paired:
              type: boolean
              const: true
            key:
              type: string
              description: The caller key's id.
            pairing:
              type: string
              description: The id of the caller key's pairing.
            state:
              type: string
              enum:
                - starting
                - running
                - failed
              description: "Where the key's bot is: `starting`, `running`, or `failed` (with `error`) and retried with backoff. Question routes answer 503 unless `running`."
            error:
              type: string
              description: Why the bot failed; present only when `state` is `failed`.
            provider:
              type: string
            displayName:
              type: string
            bot:
              type: string
            maxAttachmentBytes:
              type: number
            maxTextLength:
              type: number
              description: Most characters a request text may have.
            maxOptionCount:
              type: number
              description: Most options a request may have; absent means no provider limit
          required:
            - paired
          additionalProperties: {}
        - type: object
          properties:
            paired:
              type: boolean
              const: false
            code:
              type: string
            key:
              type: string
              description: The caller key's id.
            pairing:
              type: string
              description: The id of the caller key's pairing.
            state:
              type: string
              enum:
                - starting
                - running
                - failed
              description: "Where the key's bot is: `starting`, `running`, or `failed` (with `error`) and retried with backoff. Question routes answer 503 unless `running`."
            error:
              type: string
              description: Why the bot failed; present only when `state` is `failed`.
            provider:
              type: string
            displayName:
              type: string
            instructions:
              type: string
            bot:
              type: string
            maxAttachmentBytes:
              type: number
            maxTextLength:
              type: number
              description: Most characters a request text may have.
            maxOptionCount:
              type: number
              description: Most options a request may have; absent means no provider limit
          required:
            - paired
            - code
          additionalProperties: {}
    LogEntry:
      type: object
      properties:
        id:
          type: string
        askedAt:
          type: string
        project:
          type: string
        text:
          type: string
        options:
          type: array
          items:
            type: string
        timeoutOption:
          type: string
        timeoutSeconds:
          type: number
        status:
          type: string
        answer:
          type: string
        settledAt:
          type: string
        key:
          type: string
        pairing:
          type: string
        bot:
          type: string
      required:
        - id
        - askedAt
        - text
        - options
        - timeoutOption
        - timeoutSeconds
        - status
      additionalProperties: {}
    LogPage:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        skippedCount:
          type: integer
          minimum: 0
          description: Log lines that couldn't be read.
      required:
        - entries
        - skippedCount
    AddBotBody:
      type: object
      properties:
        provider:
          type: string
        settings:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type:
              - string
              - number
        label:
          type: string
          maxLength: 200
      required:
        - provider
        - settings
      additionalProperties: false
      description: "`settings` by config key, as `init` asks for them, without the owner. `label` is at most 200 characters."
    CreatePairingBody:
      type: object
      properties:
        bot:
          type: string
      required:
        - bot
      additionalProperties: false
    CreateKeyBody:
      type: object
      properties:
        bot:
          type: string
        pairing:
          type: string
        sameAsKey:
          type: string
        label:
          type: string
          maxLength: 200
        externalId:
          type: string
          maxLength: 200
      additionalProperties: false
      description: Exactly one of `bot` (a new pairing on that bot), `pairing` or `sameAsKey` (that key's pairing). `label` and `externalId` are stored and never interpreted, at most 200 characters.
    UpdateKeyBody:
      type: object
      properties:
        label:
          anyOf:
            - type: string
              maxLength: 200
            - type: "null"
        externalId:
          anyOf:
            - type: string
              maxLength: 200
            - type: "null"
      additionalProperties: false
      description: A string sets the field, `null` deletes it, and a missing field stays.
    AdminBot:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        label:
          type: string
        displayName:
          type: string
        state:
          type: string
          enum:
            - starting
            - running
            - failed
        error:
          type: string
        pairingCount:
          type: number
        keyCount:
          type: number
      required:
        - id
        - provider
        - state
        - pairingCount
        - keyCount
      additionalProperties: {}
    AdminPairing:
      type: object
      properties:
        id:
          type: string
        bot:
          type: string
        person:
          type: string
        state:
          type: string
          enum:
            - paired
            - pending
        code:
          type: string
        keys:
          type: array
          items:
            type: string
      required:
        - id
        - bot
        - state
        - keys
      additionalProperties: {}
    AdminKey:
      type: object
      properties:
        id:
          type: string
        pairing:
          type: string
        bot:
          type: string
        label:
          type: string
        externalId:
          type: string
        createdAt:
          type: string
      required:
        - id
        - pairing
        - bot
        - createdAt
      additionalProperties: {}
    CreatedKey:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        pairing:
          type: string
        code:
          type: string
        instructions:
          type: string
      required:
        - id
        - key
        - pairing
      additionalProperties: {}
    PairingInvite:
      type: object
      properties:
        pairing:
          $ref: "#/components/schemas/AdminPairing"
        code:
          type: string
          description: Present while the pairing waits for it.
        instructions:
          type: string
          description: How to send the code to the bot.
      required:
        - pairing
    RemovedKeys:
      type: object
      properties:
        removedKeys:
          type: array
          items:
            type: string
      required:
        - removedKeys
      additionalProperties: {}
    RotatedAdminKey:
      type: object
      properties:
        adminKey:
          type: string
      required:
        - adminKey
      additionalProperties: {}
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
  parameters:
    RequestId:
      name: id
      in: path
      required: true
      description: Id from `POST /request/async`.
      schema:
        type: string
    BotId:
      name: id
      in: path
      required: true
      description: A bot id, such as `b1`.
      schema:
        type: string
    PairingId:
      name: id
      in: path
      required: true
      description: A pairing id, such as `p1`.
      schema:
        type: string
    KeyId:
      name: id
      in: path
      required: true
      description: An API key id, such as `k1`.
      schema:
        type: string
  responses:
    UnknownRequest:
      description: "Unknown id: never created, expired 24 h after settling, or lost to a restart."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or wrong bearer token. On admin routes, anything but the admin key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Body is not valid JSON or fails validation; `error` is the first problem found. Nothing is sent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Body over 14680064 bytes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotSupported:
      description: Notifications or attachments are not supported by this provider.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SendFailed:
      description: The message couldn't be sent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotPaired:
      description: The key's pairing waits for its code (`not paired`), or its bot isn't running (`bot unavailable`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BotUnavailable:
      description: The key's bot isn't running (`bot unavailable`); it is starting or failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminBadRequest:
      description: Body is not valid JSON or fails validation; `error` names the field, never its value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnknownId:
      description: 'Unknown id, named in `error`: `unknown key "k9"`.'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SaveFailed:
      description: The registry or admin key file couldn't be written; nothing changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

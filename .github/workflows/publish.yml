name: publish

# The npm trusted publisher for jaypost is tied to this file name; renaming it breaks publishing.
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # "version" when changesets are pending, "publish" when package.json's version isn't on npm yet
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true

      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  # Opens or updates the release PR
  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true

      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: vp run version-packages
          commit-message: 'chore: release'
          pr-title: 'chore: release'

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true

      - run: vp check

      - run: vp test

      # changeset pack runs pnpm pack, whose prepack builds dist
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  # Publishes the packed tarball, pushes the vX.Y.Z tag and creates the GitHub Release
  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # changeset publish runs pnpm publish, which does trusted publishing through OIDC
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true
          registry-url: https://registry.npmjs.org

      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

  # Binaries are built per OS so darwin ones can be code-signed (tsdown can't sign on Linux)
  binaries:
    needs: publish
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 26
          cache: true

      # setup-vp selects Node 26 for the job, so plain vp run works (no vp env exec needed)
      - run: vp run build:exe
        env:
          EXE_PLATFORMS: ${{ matrix.platform }}

      - name: Sign and compress
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir release
          for binary in dist-exe/cli-"$PLATFORM"-*; do
            name="jaypost-${binary#dist-exe/cli-}"
            cp "$binary" "release/$name"
            if [ "$PLATFORM" = darwin ]; then
              codesign --sign - --force "release/$name"
            fi
            gzip -9 "release/$name"
          done
          ls -l release

      - uses: actions/upload-artifact@v5
        with:
          name: binaries-${{ matrix.platform }}
          path: release/*.gz
          if-no-files-found: error

  # One SHA256SUMS over every binary, then upload to the release
  release-assets:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          pattern: binaries-*
          path: release
          merge-multiple: true

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          cd release
          sha256sum jaypost-*.gz > SHA256SUMS
          cat SHA256SUMS
          gh release upload "v$version" jaypost-*.gz SHA256SUMS --clobber

  # Deploys the website after the binaries its install tabs link to exist
  site:
    needs: release-assets
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml

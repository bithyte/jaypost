name: publish

# The npm trusted publisher for jaypost is tied to this file name; renaming it breaks publishing.
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # "version" when changesets are pending, "publish" when package.json's version isn't on npm yet
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true

      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  # Opens or updates the release PR
  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true

      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: vp run version-packages
          commit-message: 'chore: release'
          pr-title: 'chore: release'

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true

      - id: version
        run: echo "version=$(node -p "require('./apps/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      - run: vp check

      - run: vp test

      # changeset pack runs pnpm pack, whose prepack builds dist
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  # Asks on the chat app before anything goes out. Skip or a timeout fails the job, so nothing after
  # it runs; re-run the failed jobs to ask again. Uses the released action (@v0) because ./ would
  # install the binary for the version being released, which doesn't exist yet.
  approval:
    needs: pack
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: bithyte/jaypost@v0
        with:
          text: Publish v${{ needs.pack.outputs.version }}?
          options: Publish
          default: Skip
          timeout: 3600
          provider: ${{ secrets.JAYPOST_PROVIDER }}
          bot-token: ${{ secrets.JAYPOST_BOT_TOKEN }}
          owner-id: ${{ secrets.JAYPOST_OWNER_ID }}

  # Publishes the packed tarball, pushes the vX.Y.Z tag and creates the GitHub Release
  publish:
    needs: [pack, approval]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # changeset publish runs pnpm publish, which does trusted publishing through OIDC
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true
          registry-url: https://registry.npmjs.org

      - id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

      # In a pnpm workspace changesets tags jaypost@X.Y.Z, but release-assets and `jaypost update`
      # in already installed binaries expect vX.Y.Z
      - name: Move the release to the vX.Y.Z tag
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/jaypost@$version" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$version" -f sha="$sha" > /dev/null
          gh release edit "jaypost@$version" --tag "v$version" --title "v$version"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/jaypost@$version"

  # Binaries are built per OS so darwin ones can be code-signed (tsdown can't sign on Linux)
  binaries:
    needs: publish
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 26
          cache: true

      # setup-vp selects Node 26 for the job, so plain vp run works (no vp env exec needed)
      - run: vp run build:exe
        env:
          EXE_PLATFORMS: ${{ matrix.platform }}

      - name: Sign and compress
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir release
          for binary in apps/cli/dist-exe/cli-"$PLATFORM"-*; do
            name="jaypost-${binary#apps/cli/dist-exe/cli-}"
            cp "$binary" "release/$name"
            if [ "$PLATFORM" = darwin ]; then
              codesign --sign - --force "release/$name"
            fi
            gzip -9 "release/$name"
          done
          ls -l release

      - uses: actions/upload-artifact@v5
        with:
          name: binaries-${{ matrix.platform }}
          path: release/*.gz
          if-no-files-found: error

  # One SHA256SUMS over every binary, then upload to the release
  release-assets:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          pattern: binaries-*
          path: release
          merge-multiple: true

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          cd release
          sha256sum jaypost-*.gz > SHA256SUMS
          cat SHA256SUMS
          gh release upload "v$version" jaypost-*.gz SHA256SUMS --clobber

  # Points the major tag (v0 while jaypost is 0.x) at this release so `uses: bithyte/jaypost@v0`
  # gets it. Runs after release-assets because the action downloads those binaries.
  action-tag:
    needs: release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          major="v${version%%.*}"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --jq .object.sha)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$sha" -F force=true > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$sha" > /dev/null
          fi
          echo "$major -> v$version"

  # Deploys the website after the binaries its install tabs link to exist
  site:
    needs: release-assets
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml

  # Tells the chat app once everything is out
  notify:
    needs: [pack, action-tag, site]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: bithyte/jaypost@v0
        with:
          command: notify
          text: Released v${{ needs.pack.outputs.version }}
          provider: ${{ secrets.JAYPOST_PROVIDER }}
          bot-token: ${{ secrets.JAYPOST_BOT_TOKEN }}
          owner-id: ${{ secrets.JAYPOST_OWNER_ID }}
